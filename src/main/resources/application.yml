spring:
  datasource:
    url: jdbc:h2:mem:cardapio;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true

app:
  security:
    jwt-secret: "12345678901234567890123456789012345678901234567890"
    jwt-expiration-minutes: 180
